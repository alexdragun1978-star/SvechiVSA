<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>Свечи и VSA</title>
<style>

<header><small>УЧЕБНЫЙ ТРЕНАЖЁР</small><h1>Свечи · VSA · Контекст</h1><p>Практический курс трейдера • USD/JPY</p></header>
<nav class="tabs" id="tabs"><button class="active" data-page="home">Главная</button><button data-page="candles">Свечи</button><button data-page="vsa">VSA</button><button data-page="context">Контекст</button><button data-page="practice">Практика</button><button data-page="chart">График</button><button data-page="progress">Прогресс</button></nav>
<main id="app"></main><footer>Учебное приложение. Не является торговой рекомендацией. Объём на Forex обычно тиковый, а не централизованный биржевой.</footer>
<script>
const lessons=[
['Свеча и её части','Тело показывает расстояние между открытием и закрытием. Тени показывают крайние цены периода. Большое тело — сильное направленное движение; длинная тень — отказ цены от экстремума, но только в контексте.','Не делай вывод по одной свече: оцени место, предшествующее движение и следующие бары.'],
['Доджи','Открытие и закрытие близки. Это равновесие или пауза, а не автоматический разворот. Значение повышается у важного уровня после направленного движения.','Нужны контекст и подтверждение следующей свечой.'],
['Молот','Небольшое тело в верхней части диапазона и длинная нижняя тень. После снижения может показывать отказ продавцов от более низких цен.','Сильнее у поддержки и после снижения; слабее в середине боковика.'],
['Поглощение','Тело второй свечи перекрывает тело предыдущей противоположной свечи. Показывает смену краткосрочного баланса сил.','Смотри на размер свечей, уровень и объём; тени не обязаны поглощаться.'],
['Утренняя звезда','Модель из трёх свечей после снижения: сильная медвежья, маленькая свеча неопределённости, затем сильная бычья.','Важны закрытие третьей свечи глубоко в теле первой и расположение у поддержки.'],
['Пин-бар','Свеча с длинной тенью и сравнительно небольшим телом. Отражает отклонение цены от экстремума.','Не путай любой длинный фитиль с сигналом: учитывай уровень и структуру.']
];
const vsa=[
['No Demand — нет спроса','Узкий восходящий бар на объёме ниже двух предыдущих. Покупательская активность слабая.','Ищется после роста, особенно под сопротивлением. Сам по себе не повод продавать.'],
['No Supply — нет предложения','Узкий нисходящий бар на низком объёме. Давление продавцов может ослабевать.','Ищется после снижения или теста поддержки; желательно подтверждение спросом.'],
['Stopping Volume — останавливающий объём','Повышенный объём на падении при заметном отклике цены вверх или закрытии выше минимума. Возможное поглощение продаж.','Нужен последующий тест: рынок должен показать, что предложение действительно иссякло.'],
['Up-Thrust — ложный пробой вверх','Цена выходит выше сопротивления, но закрывается обратно в диапазоне, часто с верхней тенью.','Особенно значим после роста и при повышенной активности; дождись подтверждения слабостью.'],
['Тест предложения','Цена повторно проверяет область низкого спроса/предложения на меньшем объёме и узком спреде.','Успешный тест — не гарантия роста; оцени следующий бар и общий фон.']
];
let page='home',score=Number(localStorage.getItem('sv_score')||0),done=Number(localStorage.getItem('sv_done')||0),idx=0,answered=false;
// Учебная последовательность создана для тренировки и не является историческими котировками.
let demoBars=[
[150.20,150.28,150.12,150.16,82],[150.16,150.22,150.02,150.06,105],[150.06,150.14,149.98,150.02,92],[150.02,150.08,149.82,149.88,145],[149.88,149.96,149.80,149.92,120],[149.92,150.02,149.88,149.98,88],[149.98,150.06,149.92,150.02,75],[150.02,150.10,149.96,150.06,70],[150.06,150.12,149.94,149.98,110],[149.98,150.00,149.70,149.76,190],[149.76,149.86,149.68,149.82,240],[149.82,149.90,149.78,149.88,135],[149.88,149.96,149.82,149.92,95],[149.92,150.04,149.88,150.00,90],[150.00,150.08,149.96,150.04,85],[150.04,150.12,149.98,150.10,98],[150.10,150.18,150.04,150.14,105],[150.14,150.22,150.08,150.18,115],[150.18,150.26,150.10,150.14,160],[150.14,150.18,149.96,150.00,210],[150.00,150.12,149.94,150.10,170],[150.10,150.24,150.06,150.20,130],[150.20,150.30,150.14,150.26,118],[150.26,150.32,150.18,150.22,100],[150.22,150.28,150.10,150.14,155],[150.14,150.20,149.98,150.02,225],[150.02,150.12,149.96,150.08,145],[150.08,150.18,150.02,150.16,125],[150.16,150.24,150.08,150.20,110],[150.20,150.28,150.12,150.24,100]
].map((x,i)=>({time:'Учебный бар '+(i+1),o:x[0],h:x[1],l:x[2],c:x[3],v:x[4]}));
let marketBars=demoBars,visibleBars=14;
const $=s=>document.querySelector(s);const app=$('#app');
function candleSvg(){return `<svg class="chart" viewBox="0 0 340 155"><g stroke="#25364d" stroke-width="1"><path d="M10 30H330M10 70H330M10 110H330"/></g><g stroke-width="2"><path d="M45 24V102" stroke="#35c98a"/><rect x="37" y="53" width="16" height="32" fill="#35c98a"/><path d="M95 38V128" stroke="#f06b72"/><rect x="87" y="55" width="16" height="52" fill="#f06b72"/><path d="M145 15V120" stroke="#35c98a"/><rect x="137" y="60" width="16" height="44" fill="#35c98a"/><path d="M195 20V138" stroke="#35c98a"/><rect x="187" y="37" width="16" height="15" fill="#35c98a"/><path d="M245 45V133" stroke="#f06b72"/><rect x="237" y="60" width="16" height="49" fill="#f06b72"/><path d="M295 28V118" stroke="#35c98a"/><rect x="287" y="46" width="16" height="47" fill="#35c98a"/></g><g fill="#8193ad" font-size="9"><text x="10" y="148">Учебная схема свечей • не котировки</text></g></svg>`}
function home(){return `<section class="hero"><h2>Научись читать рынок, а не угадывать фигуры</h2><p>Короткая теория, разбор поведения цены и объёма, затем самостоятельная практика. Начни с основ и двигайся к VSA.</p><div class="btnrow"><button class="btn" onclick="go('candles')">Начать обучение</button><button class="btn secondary" onclick="go('practice')">Перейти к практике</button></div></section><div class="grid"><div class="tile"><div class="ico">🕯️</div><b>Японские свечи</b><span>Форма, модели и сигналы</span></div><div class="tile"><div class="ico">📊</div><b>VSA и объём</b><span>Спрос, предложение, усилие и результат</span></div><div class="tile"><div class="ico">🧭</div><b>Контекст рынка</b><span>Тренд, уровни, диапазон</span></div><div class="tile"><div class="ico">💴</div><b>USD/JPY</b><span>Разбор графиков и тренировка</span></div></div><div class="card"><h3>Порядок обучения</h3><p>1. Пойми устройство свечи → 2. Изучи модели → 3. Добавь объём → 4. Найди контекст → 5. Проверь гипотезу на истории.</p></div>`}
function listPage(arr,type){return `<div class="card"><h3>${type==='c'?'Японские свечи':'Сигналы VSA'}</h3><p class="muted">Нажми на тему, чтобы открыть объяснение.</p>${arr.map((x,i)=>`<div class="lesson"><button onclick="detail('${type}',${i})">${x[0]}　›</button><small>${x[1].slice(0,92)}…</small></div>`).join('')}</div>`}
function detail(t,i){const x=(t==='c'?lessons:vsa)[i];app.innerHTML=`<button class="btn secondary" onclick="go('${t==='c'?'candles':'vsa'}')">← Назад</button><div class="card"><span class="tag">${t==='c'?'СВЕЧНОЙ АНАЛИЗ':'VSA'}</span><h3>${x[0]}</h3>${candleSvg()}<p>${x[1]}</p><p><b>Как применять:</b> ${x[2]}</p><p class="muted">Запомни: модель описывает поведение цены, но не предсказывает будущее с гарантией.</p></div>`}
function context(){return `<div class="card"><h3>Контекст важнее названия свечи</h3><p><b>Тренд:</b> последовательность повышающихся максимумов и минимумов — восходящая структура; понижающихся — нисходящая.</p><p><b>Поддержка:</b> область, где ранее появлялся спрос. <b>Сопротивление:</b> область, где ранее усиливалось предложение.</p><p><b>Диапазон:</b> цена движется между границами. В середине диапазона сигналы обычно менее привлекательны, чем у краёв.</p><p><b>Ложный пробой:</b> выход за уровень с быстрым возвратом. Важно увидеть закрытие обратно и реакцию следующих баров.</p><h3>Чек-лист перед выводом</h3><p>① Где цена относительно тренда и уровня?<br>② Что происходило до сигнала?<br>③ Каков спред свечи и объём относительно соседних баров?<br>④ Есть ли подтверждение?<br>⑤ Где гипотеза будет опровергнута?</p></div><div class="card"><h3>USD/JPY: таймфреймы</h3><p>Для обучения начни с H1, затем проверь контекст на H4. M15 можно использовать для детализации, но не подменяй им старший контекст.</p><span class="tag">H4 — общий фон</span><span class="tag">H1 — рабочий анализ</span><span class="tag">M15 — уточнение</span></div>`}
function chartPage(){
 const bars=marketBars.slice(0,visibleBars),max=Math.max(...bars.map(b=>b.h)),min=Math.min(...bars.map(b=>b.l)),span=max-min||0.01;
 const W=620,H=280,left=12,right=10,top=12,priceH=190,volTop=214,volH=48,slot=(W-left-right)/Math.max(bars.length,1),bodyW=Math.max(4,Math.min(12,slot*.48)),maxV=Math.max(...bars.map(b=>b.v),1);
 let grid='';for(let j=0;j<5;j++){let y=top+j*priceH/4;grid+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#26364d"/><text x="${left+2}" y="${y-3}" fill="#8193ad" font-size="9">${(max-j*span/4).toFixed(3)}</text>`}
 let sticks=bars.map((b,i)=>{let x=left+slot*(i+.5),y=v=>top+(max-v)/span*priceH,up=b.c>=b.o,color=up?'#35c98a':'#f06b72',by=Math.min(y(b.o),y(b.c)),bh=Math.max(2,Math.abs(y(b.o)-y(b.c))),vh=b.v/maxV*volH;return `<line x1="${x}" y1="${y(b.h)}" x2="${x}" y2="${y(b.l)}" stroke="${color}" stroke-width="2"/><rect x="${x-bodyW/2}" y="${by}" width="${bodyW}" height="${bh}" fill="${color}"/><rect x="${x-bodyW/2}" y="${volTop+volH-vh}" width="${bodyW}" height="${vh}" fill="${color}" opacity=".75"/>`}).join('');
 const last=bars[bars.length-1];
 return `<div class="card"><div class="stat"><span><b>USD/JPY · H1</b></span><span>${bars.length} из ${marketBars.length} свечей</span></div><p class="muted">${marketBars===demoBars?'Демонстрационный сценарий — НЕ реальные котировки.':'Загруженная история USD/JPY. Проверь источник и часовой пояс файла.'}</p><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Свечной график и объём">${grid}${sticks}<text x="12" y="276" fill="#8193ad" font-size="10">Цена</text><text x="12" y="210" fill="#8193ad" font-size="9">ОБЪЁМ</text></svg><div class="stat"><span>Последняя свеча: ${last.time}</span><span>Объём: ${last.v.toFixed(0)}</span></div><p><b>Текущий бар:</b> O ${last.o.toFixed(3)} · H ${last.h.toFixed(3)} · L ${last.l.toFixed(3)} · C ${last.c.toFixed(3)}</p><div class="btnrow"><button class="btn" onclick="stepBar(1)" ${visibleBars>=marketBars.length?'disabled':''}>Следующая свеча →</button><button class="btn secondary" onclick="stepBar(-1)" ${visibleBars<=2?'disabled':''}>← Назад</button><button class="btn secondary" onclick="visibleBars= Math.min(14,marketBars.length);render()">С начала</button></div><p class="muted">Сначала оцени контекст, спред и объём последнего бара. Только потом открывай следующую свечу.</p></div><div class="card"><h3>Загрузить реальные исторические данные</h3><p>Выбери CSV USD/JPY с колонками Date, Open, High, Low, Close, Volume (или timestamp,open,high,low,close,volume). Приложение обработает файл прямо на телефоне.</p><input id="csvfile" type="file" accept=".csv,text/csv" onchange="loadCsv(this.files[0])"><p class="muted">Источники: Dukascopy Historical Data Export. Для VSA Forex объём обычно тиковый и зависит от поставщика данных.</p><p><a href="https://www.dukascopy.com/swiss/english/marketwatch/historical/" target="_blank" style="color:#8db7ff">Открыть экспорт исторических данных Dukascopy ↗</a></p><button class="btn secondary" onclick="marketBars=demoBars;visibleBars=14;render()">Вернуться к учебному сценарию</button><div id="csvmsg" class="muted"></div></div><div class="card"><h3>Вопрос по последней свече</h3><p>Что ты проверишь в первую очередь?</p><button class="choice" onclick="chartAnswer(0)">Только название свечной модели</button><button class="choice" onclick="chartAnswer(1)">Место на графике, предыдущий тренд, спред и объём относительно соседних баров</button><button class="choice" onclick="chartAnswer(2)">Сразу открыть сделку в сторону цвета свечи</button><div id="chartfeedback"></div></div>`;
}
function stepBar(n){visibleBars=Math.max(2,Math.min(marketBars.length,visibleBars+n));render()}
function chartAnswer(n){let el=$('#chartfeedback');el.innerHTML=n===1?'<p class="good">Верно. Контекст и соотношение усилия (объём) к результату (спред/движение) важнее отдельной формы.</p>':'<p class="bad">Не совсем. Цвет или название модели сами по себе не дают торгового преимущества. Сначала оцени контекст, объём и реакцию цены.</p>'}
function loadCsv(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let lines=String(reader.result).replace(/^\uFEFF/,'').trim().split(/\r?\n/);let sep=lines[0].includes(';')?';':',';let head=lines.shift().split(sep).map(x=>x.trim().toLowerCase());let ix=k=>head.findIndex(x=>x===k||x.includes(k));let io=ix('open'),ih=ix('high'),il=ix('low'),ic=ix('close'),iv=ix('volume'),it=ix('date');if(it<0)it=ix('timestamp');if(it<0)it=ix('time');if(io<0||ih<0||il<0||ic<0)throw Error('Не найдены обязательные колонки Open, High, Low, Close.');let rows=lines.map((line,i)=>{let a=line.split(sep).map(x=>x.trim().replace(',','.'));let num=j=>Number(a[j]);let o=num(io),h=num(ih),l=num(il),c=num(ic),v=iv>=0?num(iv):0;if(![o,h,l,c].every(Number.isFinite)||h<l||h<Math.max(o,c)||l>Math.min(o,c))return null;return {time:it>=0?a[it]:'Бар '+(i+1),o,h,l,c,v:Number.isFinite(v)?v:0}}).filter(Boolean);if(rows.length<2)throw Error('В файле найдено меньше двух корректных свечей.');marketBars=rows;visibleBars=Math.min(20,rows.length);render()}catch(e){let m=$('#csvmsg');if(m)m.textContent='Ошибка CSV: '+e.message}};reader.readAsText(file)}
function practice(){const qs=[{q:'После снижения у поддержки появилась свеча с маленьким телом и длинной нижней тенью. Какой это вероятнее всего паттерн?',a:['Молот','Повешенный','Вечерняя звезда'],c:0,e:'Молот после снижения может показывать отказ от более низких цен. Нужны подтверждение и контекст.'},{q:'Что означает No Demand (нет спроса) в классическом VSA?',a:['Широкий бычий бар на рекордном объёме','Узкий восходящий бар на низком объёме','Любая красная свеча'],c:1,e:'Слабый восходящий бар с низким объёмом может указывать на отсутствие активного спроса. Важны место и последующая реакция.'},{q:'Цена проколола сопротивление и закрылась обратно под ним. Что это может быть?',a:['Подтверждённый пробой','Up-Thrust (ложный пробой вверх)','No Supply'],c:1,e:'Возврат под сопротивление после прокола может быть Up-Thrust. Дождись подтверждения слабостью.'},{q:'Где свечной сигнал обычно имеет больше смысла?',a:['В случайном месте графика','В середине широкого диапазона','У важного уровня после направленного движения'],c:2,e:'Контекст — тренд, уровень и предшествующее движение — помогает оценить значение свечи.'}];let q=qs[idx%qs.length];return `<div class="card"><div class="stat"><span>Задание ${idx+1}</span><span>Верно: ${score} / ${done}</span></div><div class="bar"><i style="width:${done?score/done*100:0}%"></i></div><h3>${q.q}</h3>${candleSvg()}${q.a.map((a,i)=>`<button class="choice" onclick="answer(${i})">${'АБВ'[i]}. ${a}</button>`).join('')}<div id="feedback"></div></div>`}
function answer(i){if(answered)return;answered=true;let qs=[0,1,2,3],q=[{c:0,e:'Молот после снижения может показывать отказ от более низких цен. Нужны подтверждение и контекст.'},{c:1,e:'No Demand — узкий восходящий бар на низком объёме относительно соседних баров.'},{c:1,e:'Up-Thrust — выход выше уровня с возвратом и закрытием обратно под ним.'},{c:2,e:'Сильнее всего модель читается у уровня и после понятного движения, а не в случайном месте.'}][idx%4];done++;if(i===q.c)score++;localStorage.setItem('sv_score',score);localStorage.setItem('sv_done',done);$('#feedback').innerHTML=`<div class="card"><h3 class="${i===q.c?'good':'bad'}">${i===q.c?'Верно!':'Не совсем.'}</h3><p>${q.e}</p><button class="btn" onclick="nextQ()">Следующее задание</button></div>`}
function nextQ(){idx++;answered=false;render()}
function progress(){return `<div class="card"><h3>Твой прогресс</h3><div class="grid"><div class="tile"><b>${done}</b><span>Ответов дано</span></div><div class="tile"><b>${score}</b><span>Правильных ответов</span></div></div><p>Точность: ${done?Math.round(score/done*100):0}%</p><div class="bar"><i style="width:${done?score/done*100:0}%"></i></div><p class="muted">Результаты тестов сохраняются на этом устройстве.</p><button class="btn secondary" onclick="score=0;done=0;idx=0;render()">Сбросить прогресс</button></div>`}
function go(p){page=p;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function render(){answered=false;app.innerHTML=page==='home'?home():page==='candles'?listPage(lessons,'c'):page==='vsa'?listPage(vsa,'v'):page==='context'?context():page==='practice'?practice():page==='chart'?chartPage():progress()}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
</script></body></html>
